<!--ecran de presentation avec l'image cliquable pour accéder au reste du portfolio.-->
    <body id="blocinfo" class="text-white min-vh-100 d-flex align-items-center justify-content-center flex-column">
        <h1 id="title" class="fa-bounce">Bienvenue sur le portfolio de Laura Laisné</h1>
        <a id="image" href="portfolio.php" class="text-center" alt="lien vers le portfolio"><img id="img-logo" class="img-fluid fa-flip w-25 object-fit-cover text-center rounded-circle" src="image/gaming.png" alt="image emote kawai theme gaing et web" title="cliquez ici"></a>
        <h2 id="subtitle" class="fa-bounce">Stagiaire en développeur web et web mobile</h2>
                
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
        
        <script>
            function animation(){
                setTimeout(function(){
                    document.getElementById("title").style.marginTop = "0";
                    document.getElementById("image").style.display = "none";
                    document.getElementById("subtitle").style.display = "none";
                },1000)
                //remet le bloc au millieu

                setTimeout(function(){
                    document.getElementById("subtitle").style.display = "block";
                    document.getElementById("subtitle").style.marginTop = "0";

                },5000)

                setTimeout(function(){
                    document.getElementById("image").style.display = "block";
                    document.getElementById("image").style.marginTop = "0";
                },8000)

                setTimeout(function(){
                    window.location.href = "portfolio.php"
                },10500)
            }
            animation();

        </script>
